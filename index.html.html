<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carlos Fortunato — Portfólio</title>
<style>
:root{
  --accent:#6f9a5a; --accent-soft:#e3ecda; --bg:#eceeea; --card:#ffffff;
  --text:#1a1f17; --muted:#6b7266; --border:rgba(0,0,0,0.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15180f; --card:#1e2318; --text:#eef0ea; --muted:#9aa394; --border:rgba(255,255,255,0.08); --accent-soft:#2a3522;
}}
:root[data-theme="dark"]{ --bg:#15180f; --card:#1e2318; --text:#eef0ea; --muted:#9aa394; --border:rgba(255,255,255,0.08); --accent-soft:#2a3522; }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}
@media (max-width:760px){.wrap{grid-template-columns:1fr;}}
.card{background:var(--card);border-radius:18px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,0.04);}
.topbar{display:flex;align-items:center;gap:8px;padding:10px;}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.pill{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;}
.pill:hover{border-color:var(--accent);}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.profile-head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 0;}
.avatar{width:58px;height:58px;border-radius:14px;overflow:hidden;background:var(--accent-soft);}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.meta{text-align:right;font-size:11px;color:var(--muted);}
.meta .langs{margin-bottom:4px;}
.meta .lang{cursor:pointer;margin-left:6px;color:var(--muted);}
.meta .lang.active{color:var(--accent);text-decoration:underline;font-weight:600;}
.info-body{padding:14px 16px 16px;display:none;}
.info-body.open{display:block;}
.bio{line-height:1.55;color:var(--text);margin-bottom:14px;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 8px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--accent-soft);color:var(--text);border-radius:999px;padding:5px 11px;font-size:12px;}
.exp-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.exp-row:last-child{border-bottom:none;}
.exp-date{color:var(--muted);flex:0 0 88px;}
.exp-role{flex:1;font-weight:600;}
.exp-co{color:var(--muted);text-align:right;}
.marquee{overflow:hidden;padding:12px 0;border-top:1px solid var(--border);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
.marquee-track{display:flex;gap:28px;width:max-content;animation:scroll 18s linear infinite;padding:0 16px;white-space:nowrap;font-weight:700;color:var(--muted);font-size:13px;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.work-list{padding:12px;display:flex;flex-direction:column;gap:10px;}
.proj{display:flex;gap:14px;background:var(--accent-soft);border-radius:14px;padding:12px;}
.proj-thumb{width:84px;height:68px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;}
.proj-body h3{margin:0 0 4px;font-size:14px;}
.proj-body p{margin:0;color:var(--muted);line-height:1.5;font-size:12.5px;}
.proj.hidden{display:none;}
.more-btn{width:calc(100% - 24px);margin:0 12px 12px;background:transparent;border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--muted);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.more-btn:hover{border-color:var(--accent);color:var(--accent);}
.contact-card{padding:14px 16px;margin-top:14px;}
.avail{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:#5cb85c;flex:0 0 auto;}
.contact-rows{display:none;margin-top:12px;}
.contact-rows.open{display:block;}
.crow{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px;}
.crow a{color:var(--text);text-decoration:none;}
.crow a:hover{color:var(--accent);}
.cbtns{display:flex;gap:8px;margin-top:10px;}
.cbtns button{border:none;border-radius:999px;padding:9px 14px;font-size:12.5px;cursor:pointer;}
.cbtns .say{background:var(--text);color:var(--bg);}
.cbtns .copy{background:var(--accent-soft);color:var(--text);}
.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;padding:10px 4px 0;}
</style>
</head>

let lang = "pt";
let open = {info:false, work:false, contact:false};

function setLang(l){
  lang = l;
  document.getElementById('lang-pt').classList.toggle('active', l==='pt');
  document.getElementById('lang-en').classList.toggle('active', l==='en');
  render();
}

function toggle(key){
  open[key] = !open[key];
  render();
}
function toggleWork(){ toggle('work'); }

function render(){
  const s = STR[lang];
  document.getElementById('t-info').textContent = s.info;
  document.getElementById('t-work').textContent = s.work;
  document.getElementById('t-contact').textContent = s.contact;
  document.getElementById('lbl-services').textContent = s.services;
  document.getElementById('lbl-exp').textContent = s.exp;
  document.getElementById('bio').textContent = s.bio;
  document.getElementById('avail-text').textContent = s.avail;
  document.getElementById('btn-say').textContent = s.say;
  document.getElementById('btn-copy').textContent = s.copy;

  document.getElementById('tags').innerHTML = s.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('exp-list').innerHTML = s.exp_list.map(e=>
    `<div class="exp-row"><span class="exp-date">${e[0]}</span><span class="exp-role">${e[1]}</span><span class="exp-co">${e[2]}</span></div>`
  ).join('');
  const m = s.marquee.concat(s.marquee);
  document.getElementById('marquee').innerHTML = m.map(x=>`<span>#${x}</span>`).join('');

  ['info','work','contact'].forEach(k=>{
    document.getElementById('pill-'+k).classList.toggle('active', open[k]);
    document.getElementById('s-'+k).textContent = open[k] ? '−' : '+';
  });
  document.getElementById('info-body').classList.toggle('open', open.info);
  document.getElementById('contact-rows').classList.toggle('open', open.contact);

  const list = document.getElementById('work-list');
  list.innerHTML = s.projects.map((p,i)=>`
    <div class="proj ${(!open.work && i>=2) ? 'hidden':''}">
      <div class="proj-thumb" style="background:${p.color}">${p.icon}</div>
      <div class="proj-body"><h3>${p.title}</h3><p>${p.desc}</p></div>
    </div>`).join('');
  document.getElementById('more-btn').textContent = open.work ? s.show_less : s.all_projects;
}

function copyEmail(){
  navigator.clipboard?.writeText(EMAIL).catch(()=>{});
  const btn = document.getElementById('btn-copy');
  const old = btn.textContent;
  btn.textContent = STR[lang].copied;
  setTimeout(()=>{ btn.textContent = old; }, 1500);
}

function tickClock(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tickClock, 1000);
tickClock();
render();
